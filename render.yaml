services:
  # 1. Render Web Service
  # Handles API endpoints, Signal Page API, and client communication
  - type: web
    name: signaldesk-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: UPSTOX_API_BASE_URL
        value: https://api.upstox.com/v2

  # 2. Render Background Worker
  # Runs continuously 24/7 during NSE and MCX market hours:
  # Upstox Live Data -> Strategy Engine -> Supabase -> Signal Page
  - type: worker
    name: signaldesk-worker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node backend/worker.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: UPSTOX_API_BASE_URL
        value: https://api.upstox.com/v2
      - key: SIGNAL_SCORE_THRESHOLD
        value: "8"
      - key: CALL_MONITOR_INTERVAL_MS
        value: "5000"
      - key: HEARTBEAT_INTERVAL_MS
        value: "60000"
